<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  /* Synchronous and inline on purpose: this must run before the first paint.
     A deferred script would let a dark-mode visitor see a flash of white.
     An explicit choice in localStorage always wins over the OS setting. */
  try {
    var t = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme',
      t === 'dark' || t === 'light' ? t
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (e) { /* private mode — the markup default stands */ }
</script>
